name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/TrayOrder.exe dist/
          Copy-Item build/Release/TrayOrderHook.dll dist/
          Copy-Item README.md,LICENSE,NOTICE.md dist/
          Compress-Archive -Path dist/* -DestinationPath TrayOrder-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TrayOrder-win64
          path: TrayOrder-win64.zip
          if-no-files-found: error
